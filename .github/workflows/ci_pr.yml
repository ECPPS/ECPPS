name: CI — Pull Request

on:
  pull_request:
    branches:
      - development
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    branches:
      - development
    types: [checks_requested]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: "clang-format"
    uses: ./.github/workflows/_clang-format.yml
    with:
      llvm-version: "20.1.8"

  build-windows:
    name: "Build Matrix (Windows)"
    needs:
      - clang-format
    uses: ./.github/workflows/_build-windows.yml
    with:
      llvm-version: "20.1.8"
      upload-artifacts: true
      enable-lto: false
      enable-ccache: true

  build-linux:
    name: "Build Matrix (Linux)"
    needs: clang-format
    uses: ./.github/workflows/_build-linux.yml
    with:
      llvm-version: "20.1.8"
      upload-artifacts: true
      enable-lto: false
      enable-ccache: true

  tests-build:
    name: "Tests - Build"
    needs: clang-format
    uses: ./.github/workflows/_tests.yml
    with:
      llvm-version: "20.1.8"

  clang-tidy:
    name: "clang-tidy"
    uses: ./.github/workflows/_clang-tidy.yml
    with:
      llvm-version: "20.1.8"

  sanitisers:
    name: "Sanitisers"
    needs:
      - build-windows
      - build-linux
    uses: ./.github/workflows/_sanitisers.yml
    with:
      llvm-version: "20.1.8"
      enable-ccache: true

  all-checks-pass:
    name: All checks pass
    if: always()
    needs:
      - clang-format
      - build-windows
      - build-linux
      - tests-build
      - clang-tidy
      - sanitisers
    runs-on: ubuntu-26.04
    steps:
      - name: Check all jobs succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "One or more required jobs failed, were skipped, or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
