name: _build-linux

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20"
      upload-artifacts:
        description: "Whether to upload build artifacts"
        required: false
        type: boolean
        default: true
      enable-lto:
        description: "Enable Link-Time Optimization in Release builds"
        required: false
        type: boolean
        default: true
      enable-ccache:
        description: "Use ccache compiler cache if available"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - compiler: Clang
            name: clang20
            build_type: Debug
            preset_configure: Linux-Clang-Debug
            preset_build: Linux-Clang-Debug-Build
            needs_llvm: true
          - compiler: Clang
            name: clang20
            build_type: Release
            preset_configure: Linux-Clang-Release
            preset_build: Linux-Clang-Release-Build
            needs_llvm: true

    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Install LLVM
        if: matrix.needs_llvm
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ inputs.llvm-version }} all

      - name: Install GCC 15 (libstdc++)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 libstdc++-15-dev

      - name: Add LLVM to PATH
        if: matrix.needs_llvm
        run: |
          echo "/usr/lib/llvm-${{ inputs.llvm-version }}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${{ inputs.llvm-version }}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Check toolchain
        run: |
          clang++ --version
          g++-14 --version
          ls /usr/lib/gcc/x86_64-linux-gnu/14

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-
            ccache-${{ runner.os }}-${{ matrix.name }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache (if available)
        if: inputs.enable-ccache
        run: |
          if command -v ccache &> /dev/null; then
            ccache --max-size=500M --set-config=compression=true
            echo "[OK] ccache configured (500M limit)"
          else
            echo "[WARN] ccache not found - proceeding without cache"
          fi

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: out/build/${{ matrix.preset_configure }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/meta-targets/mimalloc.cmake', 'cmake/meta-targets/catch2.cmake') }}

      - name: Configure
        run: |
          cmake -S . -G Ninja \
            --preset ${{ matrix.preset_configure }} \
            -DBUILD_TESTING=OFF \
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }} \
            -DENABLE_LTO=${{ inputs.enable-lto && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build \
            --preset "${{ matrix.preset_build }}" \
            --parallel

      - name: Print ccache statistics
        if: inputs.enable-ccache
        run: |
          if command -v ccache &> /dev/null; then
            echo "=== CCACHE STATISTICS ==="
            ccache --show-stats
            echo ""
            ccache --show-log-stats || true
          fi

      - name: Upload build artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.name }}-${{ matrix.build_type }}
          path: |
            out/build
            out/build/compile_commands.json
          retention-days: 3
