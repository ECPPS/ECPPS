name: _build-linux

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"
      upload-artifacts:
        description: "Whether to upload build artifacts"
        required: false
        type: boolean
        default: true
      enable-lto:
        description: "Enable Link-Time Optimization in Release builds"
        required: false
        type: boolean
        default: true
      enable-ccache:
        description: "Use ccache compiler cache if available"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - compiler: Clang
            name: clang20
            runner: ubuntu-26.04
            build_type: Debug
            preset_configure: Linux-Clang
            preset_build: Linux-Clang-Debug
            needs_llvm: true
          - compiler: Clang
            name: clang20
            runner: ubuntu-26.04
            build_type: Release
            preset_configure: Linux-Clang
            preset_build: Linux-Clang-Release
            needs_llvm: true
          - compiler: GCC
            name: gcc14
            runner: ubuntu-26.04
            build_type: Debug
            preset_configure: Linux-GCC
            preset_build: Linux-GCC-Debug
            needs_llvm: false

          - compiler: GCC
            name: gcc14
            runner: ubuntu-26.04
            build_type: Release
            preset_configure: Linux-GCC
            preset_build: Linux-GCC-Release
            needs_llvm: false

          - compiler: Clang
            name: clang20
            runner: ubuntu-24.04
            build_type: Debug
            preset_configure: Linux-Clang
            preset_build: Linux-Clang-Debug
            needs_llvm: true
          - compiler: Clang
            name: clang20
            runner: ubuntu-24.04
            build_type: Release
            preset_configure: Linux-Clang
            preset_build: Linux-Clang-Release
            needs_llvm: true

    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}${{ matrix.runner == 'ubuntu-24.04' && ' (ubuntu-24.04)' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Install LLVM
        if: matrix.needs_llvm && matrix.runner == 'ubuntu-24.04'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"
          sudo ./llvm.sh "$llvm_major"

      - name: Verify LLVM
        if: matrix.needs_llvm
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"
          llvm_bin="/usr/lib/llvm-${llvm_major}/bin"
          if [[ ! -x "$llvm_bin/clang++" ]]; then
            echo "LLVM $llvm_major is missing from the pinned Ubuntu runner image." >&2
            exit 1
          fi
          version="$("$llvm_bin/clang++" --version | head -n 1)"
          if [[ "$version" != *"clang version ${{ inputs.llvm-version }} "* ]]; then
            echo "Expected Clang ${{ inputs.llvm-version }} but found: $version" >&2
            exit 1
          fi

      - name: Install GCC 14 (libstdc++)
        run: |
          for compiler in gcc-14 g++-14; do
            if ! command -v "$compiler" >/dev/null; then
              echo "$compiler is missing from the pinned Ubuntu runner image." >&2
              exit 1
            fi
          done
          version="$(g++-14 -dumpfullversion -dumpversion)"
          expected_version="14.3.0"
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            expected_version="14.2.0"
          fi
          if [[ "$version" != "$expected_version" ]]; then
            echo "Expected GCC $expected_version but found $version." >&2
            exit 1
          fi
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Add LLVM to PATH
        if: matrix.needs_llvm
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"
          echo "/usr/lib/llvm-${llvm_major}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${llvm_major}/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Check toolchain
        run: |
          if [ "${{ matrix.compiler }}" = "Clang" ]; then
            clang++ --version | grep -F "clang version ${{ inputs.llvm-version }} "
          else
            [[ "$(g++-14 -dumpfullversion -dumpversion)" == "14.3.0" ]]
            ls /usr/lib/gcc/x86_64-linux-gnu/14
          fi

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-
            ccache-${{ runner.os }}-${{ matrix.name }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache (if available)
        if: inputs.enable-ccache
        run: |
          if command -v ccache &> /dev/null; then
            ccache --max-size=500M --set-config=compression=true
            echo "[OK] ccache configured (500M limit)"
          else
            echo "[WARN] ccache not found - proceeding without cache"
          fi

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/build/${{ matrix.preset_configure }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('cmake/meta-targets/mimalloc.cmake', 'cmake/meta-targets/catch2.cmake') }}

      - name: Configure
        run: |
          cmake --preset "${{ matrix.preset_configure }}" \
            -DBUILD_TESTING=OFF \
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }} \
            -DENABLE_LTO=${{ inputs.enable-lto && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build \
            --preset "${{ matrix.preset_build }}" \
            --parallel

      - name: Print ccache statistics
        if: inputs.enable-ccache
        run: |
          if command -v ccache &> /dev/null; then
            echo "=== CCACHE STATISTICS ==="
            ccache --show-stats
            echo ""
            ccache --show-log-stats || true
          fi

      - name: Upload build artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux-${{ matrix.name }}-${{ matrix.build_type }}${{ matrix.runner == 'ubuntu-24.04' && '-ubuntu24' || '' }}
          path: |
            out/build/${{ matrix.preset_configure }}
            out/install/${{ matrix.preset_configure }}
          retention-days: 3
