name: CI — Stable Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ci-stable-release
  cancel-in-progress: false

jobs:
  clang-format:
    name: "clang-format"
    uses: ./.github/workflows/_clang-format.yml
    with:
      llvm-version: "20.1.8"

  build-windows:
    name: "Build Matrix (Windows)"
    needs:
      - clang-format
    uses: ./.github/workflows/_build-windows.yml
    with:
      llvm-version: "20.1.8"
      upload-artifacts: true
      enable-lto: true
      enable-ccache: true

  build-linux:
    name: "Build Matrix (Linux)"
    needs: clang-format
    uses: ./.github/workflows/_build-linux.yml
    with:
      llvm-version: "20"
      upload-artifacts: true
      enable-lto: true
      enable-ccache: true

  tests:
    name: "Tests"
    needs: clang-format
    uses: ./.github/workflows/_tests.yml
    with:
      llvm-version: "20.1.8"

  clang-tidy:
    name: "clang-tidy"
    needs:
      - build-windows
      - build-linux
    uses: ./.github/workflows/_clang-tidy.yml
    with:
      llvm-version: "20.1.8"

  sanitisers:
    name: "Sanitisers"
    needs:
      - build-windows
      - build-linux
    uses: ./.github/workflows/_sanitisers.yml
    with:
      llvm-version: "20.1.8"
      enable-ccache: true

  packages:
    name: "Compiler packages"
    needs:
      - build-windows
      - build-linux
      - clang-tidy
      - sanitisers
      - tests
    uses: ./.github/workflows/_compiler-package.yml
    with:
      source-ref: ${{ github.sha }}
      source-sha: ${{ github.sha }}
      package-version: ${{ github.ref_name }}

  release:
    name: "Release"
    needs:
      - build-windows
      - build-linux
      - clang-tidy
      - sanitisers
      - tests
      - packages
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows compiler package
        uses: actions/download-artifact@v4
        with:
          name: compiler-package-windows
          path: dist/windows

      - name: Download Linux compiler package
        uses: actions/download-artifact@v4
        with:
          name: compiler-package-linux
          path: dist/linux

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ECPPS ${{ github.ref_name }}"
          body: |
            Automated stable release for Windows x64 and Linux x64 (Clang 20 Release).
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: |
            dist/windows/ecpps-windows-x64-clang.zip
            dist/linux/ecpps-linux-x64-clang.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
