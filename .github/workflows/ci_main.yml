name: CI — Main

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  # Build matrix definitions
  define-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      windows-matrix: ${{ steps.set-matrix.outputs.windows-matrix }}
      linux-matrix: ${{ steps.set-matrix.outputs.linux-matrix }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' >> $GITHUB_OUTPUT
          windows-matrix=[{"compiler":"MSVC","name":"msvc","build_type":"Debug","preset_configure":"Win64-MSVC-Debug","preset_build":"Win64-MSVC-Debug-Build","needs_msvc":true,"needs_llvm":false},{"compiler":"MSVC","name":"msvc","build_type":"Release","preset_configure":"Win64-MSVC-Release","preset_build":"Win64-MSVC-Release-Build","needs_msvc":true,"needs_llvm":false},{"compiler":"Clang","name":"clang20","build_type":"Debug","preset_configure":"Win64-Clang-Debug","preset_build":"Win64-Clang-Debug-Build","needs_msvc":false,"needs_llvm":true},{"compiler":"Clang","name":"clang20","build_type":"Release","preset_configure":"Win64-Clang-Release","preset_build":"Win64-Clang-Release-Build","needs_msvc":false,"needs_llvm":true}]
          linux-matrix=[{"compiler":"Clang","name":"clang20","build_type":"Debug","preset_configure":"Linux-Clang-Debug","preset_build":"Linux-Clang-Debug-Build","needs_llvm":true},{"compiler":"Clang","name":"clang20","build_type":"Release","preset_configure":"Linux-Clang-Release","preset_build":"Linux-Clang-Release-Build","needs_llvm":true},{"compiler":"GCC","name":"gcc15","build_type":"Debug","preset_configure":"Linux-GCC-Debug","preset_build":"Linux-GCC-Debug-Build","needs_llvm":false},{"compiler":"GCC","name":"gcc15","build_type":"Release","preset_configure":"Linux-GCC-Release","preset_build":"Linux-GCC-Release-Build","needs_llvm":false}]
          EOF

  clang-format:
    uses: ./.github/workflows/_clang-format.yml

  build-windows:
    needs: [define-build-matrix, clang-format]
    uses: ./.github/workflows/_build.yml
    with:
      os: windows-latest
      matrix-config: ${{ needs.define-build-matrix.outputs.windows-matrix }}
      upload-artifacts: true
      enable-lto: true

  build-linux:
    needs: [define-build-matrix, clang-format]
    uses: ./.github/workflows/_build.yml
    with:
      os: ubuntu-latest
      llvm-version: "20"
      matrix-config: ${{ needs.define-build-matrix.outputs.linux-matrix }}
      upload-artifacts: true
      enable-lto: true

  tests:
    needs: [build-windows, clang-format]
    uses: ./.github/workflows/_tests.yml

  clang-tidy:
    needs: [build-windows, build-linux]
    uses: ./.github/workflows/_clang-tidy.yml

  sanitisers:
    needs: [build-windows, build-linux]
    uses: ./.github/workflows/_sanitisers.yml

  release:
    needs: [clang-tidy, sanitisers, tests]
    uses: ./.github/workflows/_release-packager.yml
    with:
      artifact-name: build-windows-clang20-Release
      release-tag: v${{ github.run_number }}
      release-name: "ECPPS v${{ github.run_number }}"
      body: |
        **Release** built from `main` @ `${{ github.sha }}`

        Compiler: Clang 20.1.8
