name: CI — Feature Branch

on:
  push:
    branches:
      - "feature/**"

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    uses: ./.github/workflows/_clang-format.yml
    with:
      llvm-version: "20.1.8"

  build-windows:
    name: Build (Windows)
    needs:
      - clang-format
    uses: ./.github/workflows/_build-windows.yml
    with:
      llvm-version: "20.1.8"
      upload-artifacts: false
      enable-lto: false
      enable-ccache: true

  build-linux:
    name: Build (Linux)
    needs: clang-format
    uses: ./.github/workflows/_build-linux.yml
    with:
      llvm-version: "20"
      upload-artifacts: false
      enable-lto: false
      enable-ccache: true
