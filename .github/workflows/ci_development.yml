name: CI — Development

on:
  push:
    branches:
      - development

concurrency:
  group: ci-development
  cancel-in-progress: true

jobs:
  setup-llvm:
    uses: ./.github/workflows/_setup-llvm.yml
    with:
      llvm-version: "20.1.8"

  clang-format:
    name: "clang-format"
    needs: setup-llvm
    uses: ./.github/workflows/_clang-format.yml
    with:
      llvm-version: "20.1.8"

  build:
    name: "Build Matrix"
    needs:
      - setup-llvm
      - clang-format
    uses: ./.github/workflows/_build-windows.yml
    with:
      llvm-version: "20.1.8"
      upload-artifacts: true

  tests:
    name: "Tests"
    needs: clang-format
    uses: ./.github/workflows/_tests.yml

  clang-tidy:
    name: "clang-tidy"
    needs: build
    uses: ./.github/workflows/_clang-tidy.yml
    with:
      llvm-version: "20.1.8"

  sanitisers:
    name: "Sanitisers"
    needs: build
    uses: ./.github/workflows/_sanitisers.yml
    with:
      llvm-version: "20.1.8"

  pre-release:
    name: "Pre-release"
    needs:
      - clang-tidy
      - sanitisers
      - tests
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Clang Release artifact
        uses: actions/download-artifact@v4
        with:
          name: build-clang20-Release
          path: dist/clang-release

      - name: Package release archive
        shell: pwsh
        run: |
          $sha   = "${{ github.sha }}".Substring(0, 8)
          $archive = "ecpps-pre-release-clang-$sha.zip"

          $items = @(
            (Get-ChildItem -Recurse dist\clang-release -Include "*.exe","*.pdb") |
              Select-Object -ExpandProperty FullName
          )

          if ($items.Count -eq 0) {
            Write-Error "No build outputs found in dist/clang-release"
            exit 1
          }

          Compress-Archive -Path $items -DestinationPath $archive -Force
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV
          echo "SHA_SHORT=$sha"   >> $env:GITHUB_ENV

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "pre-release-${{ env.SHA_SHORT }}"
          name: "Pre-release ${{ env.SHA_SHORT }} (development)"
          body: |
            **Pre-release** built from `development` @ `${{ github.sha }}`.

            Compiler: Clang ${{ inputs.llvm-version || '20.1.8' }}
            Commit:   ${{ github.sha }}

            > [!WARNING]
            > This is an automated pre-release from the `development` branch.
            > It has passed the full CI suite (build, tests, clang-tidy, sanitisers)
            > but is **not** a stable release.
          prerelease: true
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
