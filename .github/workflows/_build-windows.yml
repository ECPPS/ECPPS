name: _build-windows

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"
      upload-artifacts:
        description: "Whether to upload build artifacts"
        required: false
        type: boolean
        default: true
      enable-lto:
        description: "Enable Link-Time Optimization in Release builds"
        required: false
        type: boolean
        default: true
      enable-ccache:
        description: "Use ccache compiler cache if available"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2025

    strategy:
      fail-fast: true
      matrix:
        include:
          - compiler: MSVC
            name: msvc
            build_type: Debug
            preset_configure: Win64-MSVC
            preset_build: Win64-MSVC-Debug
            needs_msvc_env: true
            needs_llvm: false

          - compiler: MSVC
            name: msvc
            build_type: Release
            preset_configure: Win64-MSVC
            preset_build: Win64-MSVC-Release
            needs_msvc_env: true
            needs_llvm: false

          - compiler: Clang
            name: clang20
            build_type: Debug
            preset_configure: Win64-Clang
            preset_build: Win64-Clang-Debug
            needs_msvc_env: false
            needs_llvm: true

          - compiler: Clang
            name: clang20
            build_type: Release
            preset_configure: Win64-Clang
            preset_build: Win64-Clang-Release
            needs_msvc_env: false
            needs_llvm: true

          - compiler: Clang-cl
            name: clang20-cl
            build_type: Debug
            preset_configure: Win64-Clang-cl
            preset_build: Win64-Clang-cl-Debug
            needs_msvc_env: true
            needs_llvm: true

          - compiler: Clang-cl
            name: clang20-cl
            build_type: Release
            preset_configure: Win64-Clang-cl
            preset_build: Win64-Clang-cl-Release
            needs_msvc_env: true
            needs_llvm: true

          - compiler: GCC
            name: gcc
            build_type: Debug
            preset_configure: Win64-GCC
            preset_build: Win64-GCC-Debug
            needs_msvc_env: false
            needs_llvm: false

          - compiler: GCC
            name: gcc
            build_type: Release
            preset_configure: Win64-GCC
            preset_build: Win64-GCC-Release
            needs_msvc_env: false
            needs_llvm: false

    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        if: matrix.needs_llvm
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"

          if (-not (Test-Path $clang)) {
            throw "LLVM installation not found at $clang"
          }

          $versionLine = (& $clang --version | Select-Object -First 1).ToString()
          Write-Host $versionLine

          $expectedVersion = "${{ inputs.llvm-version }}"
          if ($versionLine -notmatch "clang version $([regex]::Escape($expectedVersion))(\s|$)") {
            throw "Expected LLVM $expectedVersion but found: $versionLine"
          }

          Write-Host "Using preinstalled LLVM $expectedVersion"
          echo $llvmBin >> $env:GITHUB_PATH

      - name: Setup MinGW (GCC)
        if: matrix.compiler == 'GCC'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          update: false
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ccache
          msystem: UCRT64

      - name: Add MinGW to PATH
        if: matrix.compiler == 'GCC'
        shell: bash
        run: |
          echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
          version="$(C:/msys64/ucrt64/bin/g++.exe -dumpfullversion -dumpversion)"
          if [[ "$version" != "16.2.0" ]]; then
            echo "Expected UCRT64 GCC 16.2.0 but found $version." >&2
            exit 1
          fi

      - name: Setup MSVC Developer Environment
        if: matrix.needs_msvc_env
        uses: ./.github/actions/setup-msvc

      - name: Set ccache directory
        if: inputs.enable-ccache && matrix.compiler == 'GCC'
        shell: pwsh
        run: |
          $ccacheDir = Join-Path $env:RUNNER_TEMP "ccache"
          Add-Content -Path $env:GITHUB_ENV -Value "CCACHE_DIR=$ccacheDir"

      - name: Restore ccache
        if: inputs.enable-ccache && matrix.compiler == 'GCC'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-ucrt64-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-ucrt64-
            ccache-${{ runner.os }}-${{ matrix.name }}-ucrt64-
            ccache-${{ runner.os }}-ucrt64-

      - name: Setup ccache (if available)
        if: inputs.enable-ccache && matrix.compiler == 'GCC'
        shell: bash
        run: |
          if command -v ccache &> /dev/null; then
            ccache --max-size=500M --set-config=compression=true
            echo "[OK] ccache configured (500M limit)"
          else
            echo "[WARN] ccache not found - proceeding without cache"
          fi

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/build/${{ matrix.preset_configure }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('cmake/meta-targets/mimalloc.cmake', 'cmake/meta-targets/catch2.cmake') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset "${{ matrix.preset_configure }}" `
            -DBUILD_TESTING=OFF `
            -DENABLE_CCACHE=${{ inputs.enable-ccache && matrix.compiler == 'GCC' && 'ON' || 'OFF' }} `
            -DENABLE_LTO=${{ inputs.enable-lto && 'ON' || 'OFF' }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build `
            --preset "${{ matrix.preset_build }}" `
            --parallel

      - name: Print ccache statistics
        if: inputs.enable-ccache && matrix.compiler == 'GCC'
        shell: bash
        run: |
          if command -v ccache &> /dev/null; then
            echo "=== CCACHE STATISTICS ==="
            ccache --show-stats
            echo ""
            ccache --show-log-stats || true
          fi

      - name: Upload build artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows-${{ matrix.name }}-${{ matrix.build_type }}
          path: |
            out/build/${{ matrix.preset_configure }}
            out/install/${{ matrix.preset_configure }}
          retention-days: 3
