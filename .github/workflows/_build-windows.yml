name: _build-windows

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"
      upload-artifacts:
        description: "Whether to upload build artifacts"
        required: false
        type: boolean
        default: true
      enable-lto:
        description: "Enable Link-Time Optimization in Release builds"
        required: false
        type: boolean
        default: true
      enable-ccache:
        description: "Use ccache compiler cache if available"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - compiler: MSVC
            name: msvc
            build_type: Debug
            preset_configure: Win64-MSVC-Debug
            preset_build: Win64-MSVC-Debug-Build
            needs_msvc_env: true
            needs_llvm: false

          - compiler: MSVC
            name: msvc
            build_type: Release
            preset_configure: Win64-MSVC-Release
            preset_build: Win64-MSVC-Release-Build
            needs_msvc_env: true
            needs_llvm: false

          - compiler: Clang
            name: clang20
            build_type: Debug
            preset_configure: Win64-Clang-Debug
            preset_build: Win64-Clang-Debug-Build
            needs_msvc_env: false
            needs_llvm: true

          - compiler: Clang
            name: clang20
            build_type: Release
            preset_configure: Win64-Clang-Release
            preset_build: Win64-Clang-Release-Build
            needs_msvc_env: false
            needs_llvm: true

          - compiler: Clang-cl
            name: clang20-cl
            build_type: Debug
            preset_configure: Win64-Clang-cl-Debug
            preset_build: Win64-Clang-cl-Debug-Build
            needs_msvc_env: true
            needs_llvm: true

          - compiler: Clang-cl
            name: clang20-cl
            build_type: Release
            preset_configure: Win64-Clang-cl-Release
            preset_build: Win64-Clang-cl-Release-Build
            needs_msvc_env: true
            needs_llvm: true

          - compiler: GCC
            name: gcc
            build_type: Debug
            preset_configure: Win64-GCC-Debug
            preset_build: Win64-GCC-Debug-Build
            needs_msvc_env: false
            needs_llvm: false

          - compiler: GCC
            name: gcc
            build_type: Release
            preset_configure: Win64-GCC-Release
            preset_build: Win64-GCC-Release-Build
            needs_msvc_env: false
            needs_llvm: false

    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        if: matrix.needs_llvm
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"

          if (-not (Test-Path $clang)) {
            throw "LLVM installation not found at $clang"
          }

          $versionLine = (& $clang --version | Select-Object -First 1).ToString()
          Write-Host $versionLine

          $expectedVersion = "${{ inputs.llvm-version }}"
          if ($versionLine -notmatch "clang version $([regex]::Escape($expectedVersion))(\s|$)") {
            throw "Expected LLVM $expectedVersion but found: $versionLine"
          }

          Write-Host "Using preinstalled LLVM $expectedVersion"
          echo $llvmBin >> $env:GITHUB_PATH

      - name: Setup MinGW (GCC)
        if: matrix.compiler == 'GCC'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ccache
          msystem: MINGW64

      - name: Add MinGW to PATH
        if: matrix.compiler == 'GCC'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      - name: Setup MSVC Developer Environment
        if: matrix.needs_msvc_env
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-
            ccache-${{ runner.os }}-${{ matrix.name }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache (if available)
        if: inputs.enable-ccache
        shell: bash
        run: |
          if command -v ccache &> /dev/null; then
            ccache --max-size=500M --set-config=compression=true
            echo "[OK] ccache configured (500M limit)"
          else
            echo "[WARN] ccache not found - proceeding without cache"
          fi

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: out/build/${{ matrix.preset_configure }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/meta-targets/mimalloc.cmake', 'cmake/meta-targets/catch2.cmake') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -G Ninja `
            --preset ${{ matrix.preset_configure }} `
            -DBUILD_TESTING=OFF `
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }} `
            -DENABLE_LTO=${{ inputs.enable-lto && 'ON' || 'OFF' }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build `
            --preset "${{ matrix.preset_build }}" `
            --parallel

      - name: Print ccache statistics
        if: inputs.enable-ccache
        shell: bash
        run: |
          if command -v ccache &> /dev/null; then
            echo "=== CCACHE STATISTICS ==="
            ccache --show-stats
            echo ""
            ccache --show-log-stats || true
          fi

      - name: Upload build artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.name }}-${{ matrix.build_type }}
          path: |
            out/build
            out/build/compile_commands.json
          retention-days: 3
