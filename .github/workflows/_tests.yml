name: _tests

on:
  workflow_call:
    inputs:
      llvm-version:
        description: "LLVM version for the report-only unit coverage job"
        required: false
        type: string
        default: "20.1.8"

jobs:
  build-and-test:
    name: Build & Run Tests (MSVC Debug)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure with BUILD_TESTING=ON
        shell: pwsh
        run: |
          cmake --preset Win64-MSVC `
            -DBUILD_TESTING=ON `
            -DENABLE_CCACHE=OFF

      - name: Build tests
        shell: pwsh
        run: |
          cmake --build `
            --preset Win64-MSVC-Debug-Tests `
            --parallel

      - name: Run tests
        shell: pwsh
        run: |
          ctest `
            --preset Win64-MSVC-Debug `
            --parallel 2 `
            --output-on-failure

  coverage-report:
    name: Unit Coverage Report (Clang)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"
          llvm_bin="/usr/lib/llvm-${llvm_major}/bin"
          if [[ ! -x "$llvm_bin/clang++" || ! -x "$llvm_bin/llvm-profdata" || ! -x "$llvm_bin/llvm-cov" ]]; then
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh "$llvm_major" all
          fi
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${llvm_major}/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Configure coverage build
        run: cmake --preset Linux-Clang-Coverage -DENABLE_CCACHE=OFF

      - name: Build unit tests
        run: cmake --build --preset Linux-Clang-Coverage-Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir out/build/Linux-Clang-Coverage -C Debug -L unit --parallel 2 --output-on-failure

      - name: Generate coverage report
        run: |
          python3 scripts/coverage/report.py \
            --build-dir out/build/Linux-Clang-Coverage \
            --configuration Debug
          cat out/build/Linux-Clang-Coverage/coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: out/build/Linux-Clang-Coverage/coverage/
          retention-days: 14
