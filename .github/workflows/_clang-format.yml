name: _clang-format

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"

jobs:
  clang-format:
    name: clang-format / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Restore LLVM cache
        if: runner.os == 'Windows'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ inputs.llvm-version }}-windows

      - name: Install LLVM ${{ inputs.llvm-version }}
        if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "LLVM cache miss - installing LLVM ${{ inputs.llvm-version }}..."
          choco install llvm --version=${{ inputs.llvm-version }} --allow-downgrade -y

      - name: Verify LLVM installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"

          if (-not (Test-Path $clang)) {
            throw "LLVM installation not found at $clang"
          }

          Write-Host "LLVM found at: $llvmBin"
          & $clang --version

      - name: Add LLVM to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$llvm_major" all

      - name: Add LLVM to PATH (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"

          echo "/usr/lib/llvm-${llvm_major}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${llvm_major}/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Run clang-format
        shell: bash
        run: |
          files=$(git ls-files '*.cpp' '*.c' '*.h' '*.hpp' '*.cxx' '*.cc' '*.ixx' | grep -v '^$' || true)

          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi

          if ! echo "$files" | xargs clang-format --style=file --dry-run --Werror; then
            echo "clang-format violations found"
            exit 1
          fi

          file_count=$(echo "$files" | wc -l)
          echo "All files correctly formatted ($file_count files checked)"
