name: _clang-format

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "23.1.4"

jobs:
  clang-format:
    name: clang-format / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-26.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-${{ inputs.llvm-version }}-win64.msi"
          Invoke-WebRequest `
            -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm-version }}/LLVM-${{ inputs.llvm-version }}-win64.msi" `
            -OutFile $installer
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }

      - name: Setup LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clangFormat = Join-Path $llvmBin "clang-format.exe"

          if (-not (Test-Path $clangFormat)) {
            throw "LLVM/clang-format not found at $clangFormat"
          }

          $versionOutput = & $clangFormat --version
          $versionOutput | Write-Host

          $expectedSeries = "${{ inputs.llvm-version }}" -replace '\.[0-9]+$', ''
          if ($versionOutput -notmatch ([regex]::Escape($expectedSeries) + '\.\d+')) {
            throw "Expected LLVM $expectedSeries.x but found: $($versionOutput | Select-Object -First 1)"
          }

          Write-Host "Using LLVM $expectedSeries.x"
          echo $llvmBin >> $env:GITHUB_PATH

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"
          llvm_series="${{ inputs.llvm-version }}"
          llvm_series="${llvm_series%.*}"
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$llvm_major"
          sudo apt-get install -y clang-format-${llvm_major} clang-tidy-${llvm_major} llvm-${llvm_major}
          llvm_bin="/usr/lib/llvm-${llvm_major}/bin"
          if [[ ! -x "$llvm_bin/clang-format" ]]; then
            echo "clang-format is missing from the pinned Ubuntu runner image." >&2
            exit 1
          fi
          version="$("$llvm_bin/clang-format" --version)"
          if [[ "$version" != *"${llvm_series}."* ]]; then
            echo "Expected clang-format ${llvm_series}.x but found: $version" >&2
            exit 1
          fi

      - name: Add LLVM to PATH (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"

          echo "/usr/lib/llvm-${llvm_major}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${llvm_major}/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Run clang-format
        shell: bash
        run: |
          files=$(git ls-files '*.cpp' '*.c' '*.h' '*.hpp' '*.cxx' '*.cc' '*.ixx' | grep -v '^$' || true)

          if [ -z "$files" ]; then
            echo "No C/C++ files found."
            exit 0
          fi

          if ! echo "$files" | xargs clang-format --style=file --dry-run --Werror; then
            echo "clang-format violations found"
            exit 1
          fi

          file_count=$(echo "$files" | wc -l)
          echo "All files correctly formatted ($file_count files checked)"
