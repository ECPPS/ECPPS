name: _clang-format

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"

jobs:
  clang-format:
    name: clang-format
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore LLVM cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ inputs.llvm-version }}-windows

      - name: Add LLVM to PATH
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Verify clang-format version
        shell: bash
        run: clang-format --version

      - name: Run clang-format
        shell: bash
        run: |
          git ls-files '*.cpp' '*.c' '*.h' '*.hpp' '*.cxx' '*.cc' '*.ixx' \
            | xargs -P $(nproc) -I {} clang-format --style=file --dry-run --Werror "{}"
