name: _sanitisers

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20"
      enable-ccache:
        required: false
        type: boolean
        default: true

jobs:
  msvc-asan:
    name: MSVC / ASan
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (ASan)
        shell: pwsh
        run: |
          cmake --preset Win64-MSVC-ASan `
            -DBUILD_TESTING=ON `
            -DENABLE_CCACHE=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build `
            --preset Win64-MSVC-ASan-Debug-Tests `
            --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = "abort_on_error=1:detect_leaks=0"
          ctest `
            --preset Win64-MSVC-ASan-Debug `
            --parallel 2 `
            --output-on-failure


  linux-clang-asan-ubsan:
    name: Linux / Clang ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Install LLVM
        run: |
          llvm_bin="/usr/lib/llvm-20/bin"
          if [[ ! -x "$llvm_bin/clang++" ]]; then
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 20 all
          fi

      - name: Add LLVM to PATH
        run: |
          echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Check GCC 15 availability
        id: gcc15
        run: |
          if command -v gcc-15 >/dev/null && command -v g++-15 >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          source /etc/os-release
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Cache GCC 15
        if: steps.gcc15.outputs.available != 'true'
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/gcc
            /usr/bin/gcc-15
            /usr/bin/g++-15
            /usr/include/c++
          key: gcc-15-${{ runner.os }}-${{ steps.gcc15.outputs.version }}-${{ hashFiles('.github/workflows/**') }}

      - name: Install GCC 15 (libstdc++)
        if: steps.gcc15.outputs.available != 'true' && steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 libstdc++-15-dev

      - name: Configure GCC alternatives
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 150
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 150
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-san-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-san-

      - name: Configure
        run: |
          cmake --preset Linux-Clang-ASan-UBSan \
            -DBUILD_TESTING=ON \
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build \
            --preset Linux-Clang-ASan-UBSan-Debug-Tests \
            --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --preset Linux-Clang-ASan-UBSan-Debug \
            --parallel 2 \
            --output-on-failure


  linux-gcc-asan-ubsan:
    name: Linux / GCC ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check GCC 15 availability
        id: gcc15
        run: |
