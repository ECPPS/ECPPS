name: _sanitisers

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"
      enable-ccache:
        required: false
        type: boolean
        default: true

jobs:
  msvc-asan:
    name: MSVC / ASan
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC Developer Environment
        uses: ./.github/actions/setup-msvc

      - name: Configure (ASan)
        shell: pwsh
        run: |
          cmake --preset Win64-MSVC-ASan `
            -DBUILD_TESTING=ON `
            -DENABLE_CCACHE=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build `
            --preset Win64-MSVC-ASan-Debug-Tests `
            --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = "abort_on_error=1:detect_leaks=0"
          ctest `
            --preset Win64-MSVC-ASan-Debug `
            --parallel 2 `
            --output-on-failure


  linux-clang-asan-ubsan:
    name: Linux / Clang ASan + UBSan
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Install LLVM
        run: |
          llvm_version="${{ inputs.llvm-version }}"
          llvm_major="${llvm_version%%.*}"
          llvm_bin="/usr/lib/llvm-${llvm_major}/bin"
          if [[ ! -x "$llvm_bin/clang++" ]]; then
            echo "LLVM 20 is missing from the pinned Ubuntu runner image." >&2
            exit 1
          fi
          version="$("$llvm_bin/clang++" --version | head -n 1)"
          if [[ "$version" != *"clang version ${llvm_version} "* ]]; then
            echo "Expected Clang ${llvm_version} but found: $version" >&2
            exit 1
          fi

      - name: Add LLVM to PATH
        run: |
          llvm_major="${{ inputs.llvm-version }}"
          llvm_major="${llvm_major%%.*}"
          echo "/usr/lib/llvm-${llvm_major}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-${llvm_major}/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify GCC 15 toolchain
        run: |
          version="$(g++-15 -dumpfullversion -dumpversion)"
          if [[ "$version" != "15.2.0" ]]; then
            echo "Expected GCC 15.2.0 but found $version." >&2
            exit 1
          fi
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-san-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-san-

      - name: Configure
        run: |
          cmake --preset Linux-Clang-ASan-UBSan \
            -DBUILD_TESTING=ON \
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build \
            --preset Linux-Clang-ASan-UBSan-Debug-Tests \
            --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --preset Linux-Clang-ASan-UBSan-Debug \
            --parallel 2 \
            --output-on-failure


  linux-gcc-asan-ubsan:
    name: Linux / GCC ASan + UBSan
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GCC 15 toolchain
        run: |
          version="$(g++-15 -dumpfullversion -dumpversion)"
          if [[ "$version" != "15.2.0" ]]; then
            echo "Expected GCC 15.2.0 but found $version." >&2
            exit 1
          fi
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-gcc-san-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-san-

      - name: Configure
        run: |
          cmake --preset Linux-GCC-ASan-UBSan \
            -DBUILD_TESTING=ON \
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }}

      - name: Build
        run: |
          cmake --build \
            --preset Linux-GCC-ASan-UBSan-Debug-Tests \
            --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --preset Linux-GCC-ASan-UBSan-Debug \
            --parallel 2 \
            --output-on-failure
