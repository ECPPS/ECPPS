name: _sanitisers

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"
      enable-ccache:
        description: "Use ccache compiler cache if available"
        required: false
        type: boolean
        default: true

jobs:
  msvc-asan:
    name: MSVC / ASan
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\ccache
          key: ccache-${{ runner.os }}-msvc-Debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-msvc-Debug-
            ccache-${{ runner.os }}-

      - name: Setup ccache (if available)
        if: inputs.enable-ccache
        shell: bash
        run: |
          if command -v ccache &> /dev/null; then
            ccache --max-size=500M --set-config=compression=true
          fi

      - name: Configure (ASan)
        shell: pwsh
        run: |
          cmake -S . -G Ninja `
            --preset x64-MSVC-Debug-ASan `
            -DBUILD_TESTING=ON `
            -DSANITISE=ON `
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }}

      - name: Build (ASan)
        shell: pwsh
        run: |
          cmake --build build-asan `
            --preset x64-MSVC-Debug-ASan-Build `
            --parallel

      - name: Run tests under ASan
        shell: pwsh
        run: |
          $env:ASAN_OPTIONS = "abort_on_error=1:detect_leaks=0"
          ctest --test-dir out/build/x64-Debug-MSVC-ASan `
                --output-on-failure `
                --parallel "$(nproc)"

  clang-asan-ubsan:
    name: Clang / UBSan
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore LLVM cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ inputs.llvm-version }}-windows
          fail-on-cache-miss: true

      - name: Add LLVM to PATH
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore ccache
        if: inputs.enable-ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\ccache
          key: ccache-${{ runner.os }}-clang-Debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-Debug-
            ccache-${{ runner.os }}-

      - name: Setup ccache (if available)
        if: inputs.enable-ccache
        shell: bash
        run: |
          if command -v ccache &> /dev/null; then
            ccache --max-size=500M --set-config=compression=true
          fi

      - name: Configure (UBSan)
        shell: pwsh
        run: |
          cmake -S . -G Ninja `
            --preset x64-Clang-Debug-UBSan `
            -DBUILD_TESTING=ON `
            "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-sanitize-recover=all" `
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined -Xlinker -stack:10000000" `
            -DUSE_MIMALLOC=OFF `
            -DENABLE_CCACHE=${{ inputs.enable-ccache && 'ON' || 'OFF' }}

      - name: Build (UBSan)
        shell: pwsh
        run: |
          cmake --build out/build/x64-Clang-Debug-UBSan `
            --parallel

      - name: Copy UBSan runtime DLLs
        shell: pwsh
        run: |
          $llvmMajor = ("${{ inputs.llvm-version }}" -split '\.')[0]
          $llvmBin  = "C:\Program Files\LLVM\lib\clang\$llvmMajor\lib\windows"
          $buildDir = "out/build/x64-Clang-Debug-UBSan"

          $testDirs = Get-ChildItem -Recurse -Filter "*.exe" $buildDir |
                        Select-Object -ExpandProperty DirectoryName -Unique

          $runtimeDlls = @(
            "clang_rt.asan_dynamic-x86_64.dll"
          )

          foreach ($dir in $testDirs) {
            foreach ($dll in $runtimeDlls) {
              $src = Join-Path $llvmBin $dll
              if (Test-Path $src) {
                Copy-Item $src $dir -Force
                Write-Host "Copied $dll → $dir"
              }
              else {
                Write-Error "Runtime DLL not found: $src"
                exit 1
              }
            }
          }

      - name: Run tests under UBSan
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          $env:UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
          ctest --test-dir out/build/x64-Clang-Debug-UBSan `
                --output-on-failure `
                --parallel "$(nproc)"
