name: Label new issues

on:
  issues:
    types: [opened]
permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-26.04

    steps:
      - name: Add the new issue label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit "$ISSUE_URL" --add-label "new issue"
