name: Daily Pre-release

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development

      - name: Check for new commits
        id: check
        shell: pwsh
        run: |
          $lastTag = git describe --tags --match "pre-release-*" --abbrev=0 2>$null
          if ($null -eq $lastTag) {
            echo "has-new=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $lastTagSha = git rev-list -n 1 $lastTag
          $currentSha = git rev-parse HEAD

          if ($lastTagSha -ne $currentSha) {
            echo "has-new=true" >> $env:GITHUB_OUTPUT
            echo "LAST_TAG=$lastTag" >> $env:GITHUB_ENV
          } else {
            echo "has-new=false" >> $env:GITHUB_OUTPUT
          }

      - name: Download latest build artifact
        if: steps.check.outputs.has-new == 'true'
        shell: pwsh
        run: |
          $run = gh run list --workflow=ci_development.yml --branch=development --status=success --limit=1 --json=databaseId --jq='.[0].databaseId'
          if (-not $run) {
            Write-Error "No successful development build found"
            exit 1
          }

          gh run download $run --name build-windows-clang20-Release --dir dist/artifact
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create pre-release
        if: steps.check.outputs.has-new == 'true'
        uses: ./.github/workflows/_release-packager.yml
        with:
          artifact-name: build-windows-clang20-Release
          release-tag: pre-release-${{ github.sha }}
          release-name: "Pre-release (development)"
          is-prerelease: true
          body: |
            **Pre-release** from `development` @ `${{ github.sha }}`

            Automated daily build - not a stable release.
