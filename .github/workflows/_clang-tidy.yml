name: _clang-tidy

on:
  workflow_call:
    inputs:
      llvm-version:
        required: false
        type: string
        default: "20.1.8"

jobs:
  clang-tidy-ubuntu:
    name: clang-tidy (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install LLVM
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all

      - name: Add LLVM to PATH
        run: |
          echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-clang20-Release
          path: out/build

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (fetch dependencies only)
        run: |
          cmake -S . -G Ninja \
            --preset Linux-Clang-Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Verify clang-tidy version
        run: clang-tidy --version

      - name: Run clang-tidy (parallel, warnings-as-errors)
        run: |
          git ls-files '*.cpp' '*.cxx' '*.cc' '*.ixx' \
            | xargs -P "$(nproc)" -I {} clang-tidy {} \
                --warnings-as-errors='*' \
                --extra-arg=-std=c++23 \
                -- \
                -I"${GITHUB_WORKSPACE}/compiler/platformlib/include" \
                -I"${GITHUB_WORKSPACE}/compiler/platformlib/include/platformlib" \
                -I"${GITHUB_WORKSPACE}/compiler/ecpps/src" \
                -I"${GITHUB_WORKSPACE}/testing/compiler/fixtures" \
                -I"${GITHUB_WORKSPACE}/compiler/utilitieslib/include/utilitieslib" \
                -I"${GITHUB_WORKSPACE}/out/build/Linux-Clang-Release/_deps/catch2" \
                -DCLANG_TIDY \
                -DNOMINMAX

  clang-tidy-windows:
    name: clang-tidy (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore LLVM cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ inputs.llvm-version }}-windows
          fail-on-cache-miss: true

      - name: Add LLVM to PATH
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Download Clang Release build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows-clang20-Release
          path: out/build

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clear FetchContent update stamps
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*-update*" `
            -Path out/build `
            -ErrorAction SilentlyContinue |
            Remove-Item -Force

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: out/build/Win64-Clang-Release/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/meta-targets/mimalloc.cmake', 'cmake/meta-targets/catch2.cmake') }}

      - name: Configure (fetch dependencies only)
        shell: pwsh
        run: |
          cmake -S . -G Ninja `
            --preset Win64-Clang-Release `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Verify clang-tidy version
        shell: bash
        run: clang-tidy --version

      - name: Run clang-tidy (parallel, warnings-as-errors)
        shell: bash
        run: |
          git ls-files '*.cpp' '*.cxx' '*.cc' '*.ixx' \
            | xargs -P "$(nproc)" -I {} clang-tidy {} \
                --warnings-as-errors='*' \
                --extra-arg=-std=c++23 \
                -- \
                -I"${GITHUB_WORKSPACE}/compiler/platformlib/include" \
                -I"${GITHUB_WORKSPACE}/compiler/platformlib/include/platformlib" \
                -I"${GITHUB_WORKSPACE}/compiler/ecpps/src" \
                -I"${GITHUB_WORKSPACE}/testing/compiler/fixtures" \
                -I"${GITHUB_WORKSPACE}/compiler/utilitieslib/include/utilitieslib" \
                -I"${GITHUB_WORKSPACE}/out/build/Win64-Clang-Release/_deps/catch2" \
                -DCLANG_TIDY \
                -DNOMINMAX
