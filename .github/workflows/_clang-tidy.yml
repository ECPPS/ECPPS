  clang-tidy-windows:
    name: clang-tidy (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"

          if (-not (Test-Path $clang)) {
            throw "LLVM installation not found at $clang"
          }

          $versionLine = (& $clang --version | Select-Object -First 1).ToString()
          Write-Host $versionLine

          $expectedVersion = "${{ inputs.llvm-version }}"
          if ($versionLine -notmatch "clang version $([regex]::Escape($expectedVersion))(\s|$)") {
            throw "Expected LLVM $expectedVersion but found: $versionLine"
          }

          Write-Host "Using preinstalled LLVM $expectedVersion"
          echo $llvmBin >> $env:GITHUB_PATH

      - name: Download Clang Release build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows-clang20-Release
          path: out/build

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clear FetchContent update stamps
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*-update*" `
            -Path out/build `
            -ErrorAction SilentlyContinue |
            Remove-Item -Force

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: out/build/Win64-Clang/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/meta-targets/mimalloc.cmake', 'cmake/meta-targets/catch2.cmake') }}

      - name: Configure (fetch dependencies only)
        shell: pwsh
        run: |
          cmake --preset Win64-Clang `
            -DBUILD_TESTING=ON

      - name: Verify clang-tidy version
        shell: bash
        run: clang-tidy --version

      - name: Run clang-tidy (parallel, warnings-as-errors)
        shell: bash
        run: |
          git ls-files '*.cpp' '*.cxx' '*.cc' '*.ixx' \
            | xargs -P "$(nproc)" -I {} clang-tidy {} \
                --warnings-as-errors='*' \
                --extra-arg=-std=c++23 \
                -- \
                -I"${GITHUB_WORKSPACE}/compiler/platformlib/include" \
                -I"${GITHUB_WORKSPACE}/compiler/platformlib/include/platformlib" \
                -I"${GITHUB_WORKSPACE}/compiler/ecpps/src" \
                -I"${GITHUB_WORKSPACE}/testing/compiler/fixtures" \
                -I"${GITHUB_WORKSPACE}/compiler/utilitieslib/include/utilitieslib" \
                -I"${GITHUB_WORKSPACE}/out/build/Win64-Clang/_deps/catch2" \
                -DCLANG_TIDY \
                -DNOMINMAX
